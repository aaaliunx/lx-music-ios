name: Build 落雪 iOS (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [ master, main ]

jobs:
  build-ios:
    runs-on: macos-14
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Force GitHub dependencies over HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Pods
        run: cd ios && bundle exec pod install

      - name: Add Swift native modules to Xcode project
        run: |
          gem install xcodeproj
          ruby ios/add_native_modules.rb

      - name: Build unsigned archive
        run: |
          set -e
          xcodebuild \
            -workspace ios/LxMusicMobile.xcworkspace \
            -scheme LxMusicMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/LxMusicMobile.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH=$(find "$PWD/build/LxMusicMobile.xcarchive/Products/Applications" -name '*.app' -maxdepth 1 -print -quit)
          echo "App: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -r "../落雪-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: luoxue-ios-unsigned
          path: 落雪-unsigned.ipa
