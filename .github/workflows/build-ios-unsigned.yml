name: Build LX Music iOS (unsigned IPA)

on:
  workflow_dispatch:        # 手动触发
  push:
    branches: [ master ]    # 推送到 master 自动触发

jobs:
  build-ios:
    runs-on: macos-latest
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Pods
        run: cd ios && bundle exec pod install

      - name: Build unsigned archive
        run: |
          set -e
          xcodebuild \
            -workspace ios/LxMusicMobile.xcworkspace \
            -scheme LxMusicMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/LxMusicMobile.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH=$(find "$PWD/build/LxMusicMobile.xcarchive/Products/Applications" -name '*.app' -maxdepth 1 -print -quit)
          echo "App: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -r "../LxMusicMobile-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LxMusicMobile-unsigned-ipa
          path: LxMusicMobile-unsigned.ipa
