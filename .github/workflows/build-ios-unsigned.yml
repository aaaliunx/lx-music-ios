name: Build 落雪 iOS (unsigned IPA)

on:
  workflow_dispatch:        # 手动触发
  push:
    branches: [ master, main ]    # 推送到 master/main 自动触发

jobs:
  build-ios:
    # 固定到 macOS-14 (Xcode 15.4)。注意：macos-latest 现在是 macOS-26 / Xcode 26，
    # 其 iOS 26 SDK 已移除 swiftCompatibility56/Concurrency 兼容库，
    # 会导致 Swift 库（SwiftAudioEx、react-native-track-player）链接失败。
    runs-on: macos-14
    env:
      CI: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 18
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      # react-native-file-system 通过 git+ssh 从 GitHub 引用，在 CI 无 SSH key 时会拉取失败，
      # 导致运行时报 "package doesn't seem to be linked"。全局把 ssh 协议替换为 https。
      - name: Force GitHub dependencies over HTTPS
        run: git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"

      - name: Install npm dependencies
        run: npm ci

      - name: Setup Ruby & Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Install Pods
        run: cd ios && bundle exec pod install

      - name: Build unsigned archive
        run: |
          set -e
          xcodebuild \
            -workspace ios/LxMusicMobile.xcworkspace \
            -scheme LxMusicMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/LxMusicMobile.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package unsigned IPA
        run: |
          set -e
          APP_PATH=$(find "$PWD/build/LxMusicMobile.xcarchive/Products/Applications" -name '*.app' -maxdepth 1 -print -quit)
          echo "App: $APP_PATH"
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -r "../落雪-unsigned.ipa" Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: luoxue-ios-unsigned
          path: 落雪-unsigned.ipa
